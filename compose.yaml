services:
  postgres:
    image: postgis/postgis:17-3.4
    shm_size: 1g
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyclingdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cyclingdb -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # PostgreSQL configuration for connection pooling
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "idle_in_transaction_session_timeout=35min"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "synchronous_commit=off"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 14g
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyclingdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:25080,http://localhost:8080
      SIMRA_DATA_PATH: /app/data/SimRa
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # SimRa ride files; override the host location via SIMRA_HOST_PATH in .env
      # (e.g. SIMRA_HOST_PATH=/Users/me/Downloads/SimRa)
      - ${SIMRA_HOST_PATH:-./data/SimRa}:/app/data/SimRa:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      simra:
        aliases:
          - spring

networks:
  simra:
    name: simra_simra-network
    external: true
