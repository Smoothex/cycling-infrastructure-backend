name: cycling-infrastructure

services:
  postgres:
    image: postgis/postgis:17-3.4
    mem_limit: 1g
    cpus: 0.5
    shm_size: 256m
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: cyclingdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cyclingdb -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # PostgreSQL server settings.
    command: >-
      postgres
      -c max_connections=30
      -c statement_timeout=10min
      -c idle_in_transaction_session_timeout=35min
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c wal_compression=on
      -c max_wal_size=2GB
      -c min_wal_size=256MB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off

  pgadmin:
    profiles: [admin]
    image: dpage/pgadmin4
    mem_limit: 256m
    cpus: 0.25
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-15050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    mem_limit: 6g
    cpus: 1.5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyclingdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:25080,http://localhost:18080}
      SIMRA_DATA_PATH: /app/data/SimRa
      TILES_DIRECTORY: ${TILES_DIRECTORY:-/app/data/tiles}
      PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
      PIPELINE_IMPORT_ENABLED: ${PIPELINE_IMPORT_ENABLED:-true}
      PIPELINE_ENRICHMENT_ENABLED: ${PIPELINE_ENRICHMENT_ENABLED:-false}
      PIPELINE_ENRICHMENT_WEATHER_ENABLED: ${PIPELINE_ENRICHMENT_WEATHER_ENABLED:-false}
      PIPELINE_ENRICHMENT_OHSOME_ENABLED: ${PIPELINE_ENRICHMENT_OHSOME_ENABLED:-false}
      PIPELINE_ENRICHMENT_BERLINOPENDATA_ENABLED: ${PIPELINE_ENRICHMENT_BERLINOPENDATA_ENABLED:-false}
      PIPELINE_ENRICHMENT_TRAFFIC_ENABLED: ${PIPELINE_ENRICHMENT_TRAFFIC_ENABLED:-false}
      HEIGIT_API_KEY: ${HEIGIT_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    volumes:
      # OSM input, routing/enrichment caches and generated files.
      - type: bind
        source: ${APP_DATA_PATH:-./data}
        target: /app/data
        bind:
          create_host_path: false
      # Mount the directory containing Rides, not Rides itself.
      - type: bind
        source: ${SIMRA_HOST_PATH:-./data/SimRa}
        target: /app/data/SimRa
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
