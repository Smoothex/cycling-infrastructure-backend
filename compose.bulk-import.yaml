services:
  postgres:
    image: postgis/postgis:17-3.4
    shm_size: 1g
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyclingdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d cyclingdb -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Non-durable bulk mode. A crash can leave this database unrecoverable.
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "idle_in_transaction_session_timeout=35min"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "fsync=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "synchronous_commit=off"
