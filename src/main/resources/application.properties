spring.application.name=cycling-infrastructure-backend
spring.jpa.hibernate.ddl-auto=update

# Set to true to see what SQL queries Hibernate executes
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyclingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:25080,http://localhost:8080}

spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=300000
spring.datasource.hikari.pool-name=CyclingDBPool

# Performance Tuning: Batch Inserts to bundle SQL statements
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

logging.pattern.console=%d{HH:mm:ss} %-5level %logger{15} : %msg%n

# --- Pipeline coordination --------------------------------------------------
pipeline.enabled=true
pipeline.scheduler.thread-pool-size=6

# SimRa file import
pipeline.import.enabled=false
pipeline.import.batch-size=500
pipeline.import.thread-pool-size=10
# Delay between bounded batches; scanning stops after the source is exhausted
pipeline.import.delay-ms=2000

# Enrichment
pipeline.enrichment.enabled=true

# Weather
pipeline.enrichment.weather.enabled=true
# Distinct 0.1 degree grid/year locations per Open-Meteo request (maximum 5)
pipeline.enrichment.weather.batch-size=5
# Maximum events claimed and updated in one weather batch
pipeline.enrichment.weather.event-batch-size=25000
# Fixed delay between permanent bulk batches
pipeline.enrichment.weather.delay-ms=60000
pipeline.enrichment.weather.initial-retry-delay=PT1M
pipeline.enrichment.weather.max-retry-delay=PT30M
pipeline.enrichment.weather.connect-timeout=PT30S
pipeline.enrichment.weather.request-timeout=PT2M

# Historical OSM data
pipeline.enrichment.ohsome.enabled=false
pipeline.enrichment.ohsome.batch-size=5000
pipeline.enrichment.ohsome.delay-ms=60000

# Berlin Open Data (VIZ) - Road disruptions
pipeline.enrichment.berlin-open-data.enabled=true
pipeline.enrichment.berlin-open-data.batch-size=2500
pipeline.enrichment.berlin-open-data.delay-ms=1000

# Berlin Open Data (VIZ) - Traffic data
pipeline.enrichment.traffic.enabled=true
pipeline.enrichment.traffic.batch-size=2500
pipeline.enrichment.traffic.delay-ms=1000

# --- Domain / provider parameters -------------------------------------------

# GraphHopper Configuration
graphhopper.osm.file=./data/osm/germany-latest.osm.pbf
graphhopper.osm.download-url=https://download.geofabrik.de/europe/germany-latest.osm.pbf
graphhopper.graph.location=./data/graphhopper-cache
graphhopper.elevation.cache_dir=./data/elevation-cache

# SimRa data source (inside the compose backend this is /app/data/SimRa)
simra.data.path=./data/SimRa

# Vector Tile Generation
tiles.directory=./data/tiles
tiles.tippecanoe-binary=tippecanoe
tiles.tile-join-binary=tile-join
tiles.build-timeout-minutes=30
# how often to check whether pipeline changes require a tile rebuild
tiles.auto-rebuild-check-ms=300000
# automatic builds wait until import, analysis, and enrichment have all been idle
tiles.auto-rebuild.enabled=true
tiles.auto-rebuild.quiet-period-ms=900000

# Detour analysis parameters
analysis.minimum-origin-destination-distance-meters=500
analysis.detour.threshold=0.10
analysis.detour.maximum-equivalent-excess-meters=500
analysis.route-overlap.minimum-ratio=0.30
analysis.spatial.proximity-meters=20
analysis.route-review.sample-per-type=30

enrichment.berlin-open-data.url=https://api.viz.berlin.de/daten/baustellen_sperrungen_viz.json
enrichment.berlin-open-data.cache-file=./data/berlinOpenData/cache/baustellen_sperrungen_viz.json
# Periodic re-import of the VIZ feed (live snapshot) to accumulate closure history
enrichment.road-closures.refresh-ms=86400000

# Ohsome v2 historical OSM snapshots
ohsome.v2.base-url=https://api.heigit.org/ohsome-api-staging/v2
ohsome.v2.api-key=${HEIGIT_API_KEY:}
ohsome.v2.cache-path=./data/ohsome/v2/berlin-10km-monthly-v1
ohsome.v2.start-month=2019-01
ohsome.v2.end-month=2025-01
ohsome.v2.bbox=12.94,52.24,13.91,52.77
ohsome.v2.filter=type:way and highway=*
ohsome.v2.clip=false
ohsome.v2.download-interval=PT60S
ohsome.v2.max-retries=3
ohsome.v2.initial-retry-delay=PT1M
ohsome.v2.max-retry-delay=PT30M
ohsome.v2.connect-timeout=PT30S
ohsome.v2.request-timeout=PT30M

# Berlin Traffic Detection Enrichment
enrichment.traffic.cache-dir=./data/berlinTraffic/cache
enrichment.traffic.stammdaten-url=https://mdhopendata.blob.core.windows.net/verkehrsdetektion/Stammdaten_Verkehrsdetektion_2022_07_20.xlsx
enrichment.traffic.match-radius-meters=75
enrichment.traffic.candidate-limit=25
enrichment.traffic.min-quality=0.75
enrichment.traffic.min-completeness-percent=75
enrichment.traffic.light-volume-threshold=150
enrichment.traffic.heavy-volume-threshold=800
enrichment.traffic.low-speed-kmh=30
enrichment.traffic.congested-speed-kmh=20
